name: Prepare reviewed alpha release draft
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful Build and verify workflow run ID for this exact commit'
        required: true
      tag:
        description: 'New alpha tag, for example v0.3.0-alpha.1'
        required: true
permissions:
  contents: write
  actions: read
jobs:
  draft:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify successful CI and exact source commit
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > run.json
          python -c 'import json,os; r=json.load(open("run.json")); assert r["conclusion"]=="success" and r["head_sha"]==os.environ["GITHUB_SHA"] and r["path"]==".github/workflows/ci.yml"'
      - uses: actions/download-artifact@v4
        with:
          name: TtroClient-Windows-alpha
          path: release-assets
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Create draft only; publication remains manual
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          cd release-assets
          sha256sum --check checksums.txt
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Ttro Client $TAG" --draft --prerelease --notes-file ../docs/RELEASE_NOTES.md ./*
