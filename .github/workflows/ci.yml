name: Build and verify 1.8.9 alpha
on:
  push:
    branches: [main, 'integration/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ttro-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  client:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - run: python tools/build.py
      - run: python -m unittest discover -s tests -p 'test*.py'
      - uses: actions/upload-artifact@v4
        with:
          name: client-payload
          path: launcher/payload/
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    needs: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: client-payload
          path: launcher/payload
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native core regression
        run: dotnet run --project tests/native/Ttro.Launcher.Tests.csproj -c Release
      - name: Restore native dependencies and collect notices
        run: |
          dotnet restore launcher/native/Ttro.Launcher/Ttro.Launcher.csproj -r win-x64
          python tools/native_notices.py
      - name: Self-contained Windows launcher
        run: dotnet publish launcher/native/Ttro.Launcher/Ttro.Launcher.csproj -c Release -r win-x64 --self-contained true -o dist/portable
      - name: Native Windows UI smoke
        shell: pwsh
        run: ./tests/windows_launcher_qa.ps1
      - name: Package installer
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          python tools/package_windows.py --makensis 'C:\Program Files (x86)\NSIS\makensis.exe'
      - name: Install, operate installed launcher and uninstall
        shell: pwsh
        run: ./tests/windows_installer_qa.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: TtroClient-Windows-alpha
          path: |
            dist/TtroClient-Setup.exe
            dist/TtroClient-Portable.zip
            dist/checksums.txt
            dist/ttro-client-1.8.9-*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: TtroClient-QA-windows
          path: |
            research/windows-*-smoke.json
            research/windows-context.png
          if-no-files-found: error
  game:
    runs-on: ubuntu-24.04
    needs: client
    timeout-minutes: 20
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/../toolchain/gradle-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: client-payload
          path: launcher/payload
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore official Forge compile API
        run: python tools/build.py
      - name: Virtual desktop and real runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-xserver-utils libxtst6 libgl1-mesa-dri libglx-mesa0
          pip install Pillow
          python tools/bootstrap_game_qa.py
      - name: Settings, HUD and official Mod API smoke
        run: python tools/game_qa.py --game qa-alpha3-native --fast
      - name: Official Mouse Tweaks reference with actual window input
        run: python tools/game_qa.py --game qa-alpha3-baseline --baseline --inventory-only
      - name: Patcher, inventory, HeadFX, world and pack regression
        run: python tools/game_qa.py --game qa-alpha3-stack --patcher --packs
      - name: Paired software-renderer frametime samples
        run: python tools/game_qa.py --game qa-alpha3-benchmark --bench-only --fps 0 --pairs 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TtroClient-QA-game
          path: |
            research/game-qa/qa-alpha3-*/
            research/qa-alpha3-*.log
          if-no-files-found: warn
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/website.test.cjs
        env:
          TTRO_USE_LOCAL_PLAYWRIGHT: '1'
